[package]
name = "alfredpet"
version = "0.1.0"
edition = "2021"
default-run = "AlfredPet"
description = "AlfredPet personal Windows assistant"
publish = false
license = "MIT"

[lib]
name = "alfredpet_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "AlfredPet"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
rusqlite = { version = "0.38", features = ["bundled", "backup", "hooks", "limits"] }
sqlparser = { version = "=0.63.0", features = ["visitor"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["json", "rustls", "multipart", "form"] }
dom_query = "=0.28.0"
dunce = "=1.0.5"
axum = "0.8"
sha2 = "0.10"
base64 = "0.22"
getrandom = "=0.4.3"
zip = { version = "8", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
lopdf = "0.40"
jsonschema = "0.46"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_JobObjects", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_StationsAndDesktops", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem"] }

[features]
default = ["semantic_memory"]
semantic_memory = []

[dev-dependencies]
h2 = "=0.4.19"
axum = { version = "0.8", features = ["ws"] }
